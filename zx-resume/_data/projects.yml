# Projects
# AssimNet
- project: "AssimNet: Bridging Field Measurements and Numerical Simulations"
  duration: April 2023 &mdash; Present
  url: https://doi.org/10.2139/ssrn.5974792
  description: <ul class="resume-item-list"><li>Developed a hybrid neural framework that translates field measurements into simulation-ready inputs and calibrates production forecasts during training.</li><li>Evaluated the model on synthetic cases and more than 1,400 Montney shale gas wells, improving forecasting and generalization under limited-data conditions.</li></ul>

