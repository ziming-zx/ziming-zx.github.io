# Site settings
title: "Ziming Xu | Curriculum Vitae"
description: "Ziming Xu, Ph.D. — Senior Research Engineer at SINOPEC Oil Exploration & Development Research Institute, Beijing, China."
url: "https://ziming-zx.github.io"
baseurl: "/zx-resume"

# The original template's domain and development files must not be published.
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - LICENSE
  - README.md
  - vendor/
  - _vendor/

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Ziming Xu"
resume_title:                   "Senior Research Engineer"
resume_affiliation:             "SINOPEC Oil Exploration & Development Research Institute"
resume_department:              "Oversea Key Project Support Center"
resume_location:                "Beijing, China"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "xuziming.syky@sinopec.com"
resume_secondary_email:         "ziming4@ualberta.ca"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_address:         "Beijing, China"

resume_header_contact_info:     "Beijing, China"
display_header_contact_info:    "true"

resume_header_intro: "<p>I am a Senior Research Engineer at SINOPEC Oil Exploration &amp; Development Research Institute, working in the Oversea Key Project Support Center in Beijing, China. I completed my Ph.D. in Petroleum Engineering at the University of Alberta in August 2025.</p><p>My research focuses on deep learning, production forecasting and numerical methods for subsurface systems, connecting field measurements, physical understanding and data-driven models.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_translation:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_education:       true
resume_section_experience:      true
resume_section_projects:        true
resume_section_activities:      true
# resume_section_skills:          true
# resume_section_award:           true
resume_section_links:           true
resume_section_publications:    true
resume_section_preprints:       true
resume_section_conferences:     true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/ziming-zx"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://linkedin.com/in/ziming-xu-kimi"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "https://orcid.org/0000-0002-6937-1307"
  resume_medium_url:            "https://scholar.google.ca/citations?user=AakA-w0AAAAJ&hl=en&oi=sra"
resume_print_social_links:      true

# Design settings
resume_theme:                   rockies

